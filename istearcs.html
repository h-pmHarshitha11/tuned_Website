<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="navbar.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Roboto", sans-serif;
      background: #111115;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
    }

    /* Elegant Coming Soon Modal */
    /* Elegant Coming Soon Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2500;
      pointer-events: auto;
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .modal-content {
      background: rgba(23, 23, 23, 0.95);
      border: 1px solid rgba(196, 190, 180, 0.2);
      border-radius: 20px;
      padding: 60px 40px;
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      transform: translateY(30px);
      animation: slideUp 0.8s ease-out forwards;
      max-width: 500px;
      width: 90%;
      position: relative;
    }

    @keyframes slideUp {
      to {
        transform: translateY(0);
      }
    }

    .modal-content h1 {
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 2.8rem;
      color: #c4beb4;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .modal-content p {
      font-family: "Roboto", Arial, sans-serif;
      font-size: 1.1rem;
      color: #e0e0e0;
      font-weight: 400;
      line-height: 1.6;
      margin: 0;
      max-width: 400px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: #c4beb4;
      font-size: 24px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: all 0.3s ease;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: rgba(196, 190, 180, 0.1);
      color: #fff;
      transform: scale(1.1);
    }

    .social-row {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 34px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .social-row a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #222;
      box-shadow: 0 2px 6px #111a;
      transition: background 0.25s, transform 0.22s;
      cursor: pointer;
    }

    .social-row a:hover {
      background: #c4beb4;
      transform: scale(1.12);
    }

    .social-row img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: grayscale(100%) brightness(1.2) drop-shadow(0 2px 8px #fff6);
      transition: filter 0.25s;
      display: block;
    }

    .social-row a:hover img {
      filter: none;
    }

    footer {
      background: #111;
      padding: 20px 0;
      text-align: center;
      border-top: 1px solid #333;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1rem;
      color: #fff;
      user-select: none;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="hero-logo-bg">
    <img src="Iste logo perfect background removed.png" alt="ISTE Background Logo">
  </div>
  <header role="banner">
    <!-- Navigation -->
    <nav class="navbar">
      <a href="index.html" class="brand">
        <img src="Iste logo perfect background removed.png" alt="ISTE Logo" class="logo-img" />
        <span class="site-title">ISTE · PESCE</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="event.html">Events</a></li>
        <li class="dropdown">
          <a href="#" class="dropdown-toggle">Student Chapters <i class="fas fa-chevron-down"
              style="font-size: 0.8em; margin-left: 5px;"></i></a>
          <ul class="dropdown-menu">
            <li><a href="our_team_new.html">Student Core</a></li>
            <li><a href="istewings.html">ISTE WINGS</a></li>
            <li><a href="istearcs.html" class="active">ISTE ARCS</a></li>

        </li>

        <li><a href="aboutus.html">About</a></li>
      </ul>

      <div class="mobile-menu-toggle" id="mobileToggle">

        <span></span>
        <span></span>
      </div>
    </nav>
  </header>
  <main style="flex-grow: 1"></main>
  <div class="modal-overlay" id="coming-soon-modal" tabindex="0" aria-modal="true" role="dialog"
    aria-label="Coming Soon">
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Close modal">

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const menuIcon = document.getElementById("menu-icon");
      const navLinks = document.getElementById("nav-links");
      const rotate_1 = document.getElementById("rotate_1");
      const rotate_2 = document.getElementById("rotate_2");
      const hide_1 = document.getElementById("hide_1");
      const hide_2 = document.getElementById("hide_2");

      function updateAriaExpanded(isExpanded) {
        menuIcon.setAttribute("aria-pressed", isExpanded);
        const dropdownToggles = document.querySelectorAll(".dropdown-toggle");
        dropdownToggles.forEach((toggle) =>
          toggle.setAttribute("aria-expanded", isExpanded)
        );
      }

      menuIcon.addEventListener("click", () => {
        navLinks.classList.toggle("open");
        const open = navLinks.classList.contains("open");
        updateAriaExpanded(open);
        if (open) {
          rotate_1.style.transform = "rotate(45deg) translate(5px, 5px)";
          rotate_2.style.transform = "rotate(-45deg) translate(5px, -5px)";
          hide_1.style.opacity = "0";
          hide_2.style.opacity = "0";
        } else {
          rotate_1.style.transform = "rotate(0deg)";
          rotate_2.style.transform = "rotate(0deg)";
          hide_1.style.opacity = "1";
          hide_2.style.opacity = "1";
        }
      });

      // Keyboard accessible toggle
      menuIcon.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          menuIcon.click();
        }
      });

      // Close mobile menu on link click
      document.querySelectorAll(".nav-links a").forEach((link) => {
        link.addEventListener("click", () => {
          if (navLinks.classList.contains("open")) {
            navLinks.classList.remove("open");
            updateAriaExpanded(false);
            rotate_1.style.transform = "rotate(0deg)";
            rotate_2.style.transform = "rotate(0deg)";
            hide_1.style.opacity = "1";
            hide_2.style.opacity = "1";
          }
        });
      });
    });
  </script>

  <!-- Modal functionality -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const modal = document.getElementById("coming-soon-modal");
      const closeBtn = document.getElementById("modal-close");

      // Close modal when close button is clicked
      closeBtn.addEventListener("click", function () {
        modal.style.opacity = "0";
        setTimeout(() => {
          modal.style.display = "none";
        }, 300);
      });

      // Close modal when clicking outside the modal content
      modal.addEventListener("click", function (e) {
        if (e.target === modal) {
          modal.style.opacity = "0";
          setTimeout(() => {
            modal.style.display = "none";
          }, 300);
        }
      });

      // Close modal with Escape key
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.style.display !== "none") {
          modal.style.opacity = "0";
          setTimeout(() => {
            modal.style.display = "none";
          }, 300);
        }
      });
    });
  </script>
</body>

</html>
